<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Brianna Dickenson Front-End Developer Portfolio</title>
  <desc id="desc">Feminine front-end developer portfolio cover featuring Aura and Ambiance, Cosmic Cutie, and Glamour Forecast.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#fff8fc"/><stop offset=".55" stop-color="#f5ecff"/><stop offset="1" stop-color="#ffeef6"/></linearGradient>
    <linearGradient id="aura" x1="0" x2="1"><stop stop-color="#f7eadf"/><stop offset="1" stop-color="#eadff7"/></linearGradient>
    <linearGradient id="cosmic" x1="0" x2="1"><stop stop-color="#171827"/><stop offset="1" stop-color="#574275"/></linearGradient>
    <linearGradient id="glam" x1="0" x2="1"><stop stop-color="#fbe6f1"/><stop offset="1" stop-color="#f6d9bc"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#6f5269" flood-opacity=".14"/></filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1070" cy="80" r="180" fill="#eadfff" opacity=".52"/>
  <circle cx="80" cy="560" r="160" fill="#ffdce9" opacity=".55"/>
  <text x="72" y="95" font-family="Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="3" fill="#8a6c82">FRONT-END DEVELOPER</text>
  <text x="72" y="160" font-family="Georgia, serif" font-size="54" font-weight="700" fill="#4b3a49">Brianna Dickenson</text>
  <text x="72" y="205" font-family="Arial, sans-serif" font-size="24" fill="#705f6e">React · Next.js · TypeScript · APIs · Testing · Accessibility</text>
  <g filter="url(#shadow)">
    <g transform="translate(72 275) rotate(-2)">
      <rect width="310" height="215" rx="26" fill="#fff"/>
      <rect x="14" y="14" width="282" height="122" rx="18" fill="url(#aura)"/>
      <text x="34" y="64" font-size="42">🌿</text><text x="34" y="109" font-family="Georgia, serif" font-size="26" font-weight="700" fill="#59495a">Aura &amp; Ambiance</text>
      <text x="24" y="169" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#79589f">E-COMMERCE · ZUSTAND</text>
      <text x="24" y="194" font-family="Arial, sans-serif" font-size="14" fill="#7d6d7a">Buyer journey + persistent cart</text>
    </g>
    <g transform="translate(445 250) rotate(2)">
      <rect width="310" height="235" rx="26" fill="#fff"/>
      <rect x="14" y="14" width="282" height="140" rx="18" fill="url(#cosmic)"/>
      <text x="34" y="68" font-size="44">🪐</text><text x="34" y="118" font-family="Georgia, serif" font-size="27" font-weight="700" fill="#fff">Cosmic Cutie</text>
      <text x="24" y="187" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#79589f">REDUX · APIs · CHART.JS</text>
      <text x="24" y="212" font-family="Arial, sans-serif" font-size="14" fill="#7d6d7a">Lunar data + 99 Lighthouse</text>
    </g>
    <g transform="translate(818 276) rotate(-1)">
      <rect width="310" height="215" rx="26" fill="#fff"/>
      <rect x="14" y="14" width="282" height="122" rx="18" fill="url(#glam)"/>
      <text x="34" y="64" font-size="42">💄</text><text x="34" y="109" font-family="Georgia, serif" font-size="26" font-weight="700" fill="#59495a">Glamour Forecast</text>
      <text x="24" y="169" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#b85f88">MULTI-API · ZUSTAND</text>
      <text x="24" y="194" font-family="Arial, sans-serif" font-size="14" fill="#7d6d7a">Weather-powered beauty discovery</text>
